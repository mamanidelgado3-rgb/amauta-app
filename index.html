<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AmautaDriver">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>AmautaDriver</title>
<style>
:root{--bg:#e9e9ec;--ink:#111;--y:#FFCC0A;--k:#0B0B0B;--k2:#1a1a1a;--k3:#2a2a2a;--mu:#9a9a9a;--ok:#3ddc84;--bad:#ff5d5d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050505;--ink:#eee}}
:root[data-theme="dark"]{--bg:#050505;--ink:#eee}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:10px}
.phone{width:100%;max-width:390px;height:780px;max-height:calc(100vh - 60px);background:var(--k);border-radius:36px;border:8px solid #000;overflow:hidden;position:relative;color:#fff;box-shadow:0 20px 60px #0005}
.adm{width:100%;max-width:1000px;background:var(--k);color:#fff;border-radius:20px;padding:18px;min-height:600px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.map{flex:1;position:relative;background:#161616;min-height:0}.map svg{width:100%;height:100%;display:block}
.sheet{background:var(--k);border-radius:24px 24px 0 0;padding:16px;margin-top:-20px;position:relative;box-shadow:0 -8px 24px #000a;overflow:auto;max-height:68%}
h2{font-size:19px;margin-bottom:10px}.mu{color:var(--mu);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.fld{background:var(--k2);border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px;display:flex;gap:10px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:#fff;flex:none}.dot.y{background:var(--y)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.chip{background:var(--k2);border:1px solid var(--k3);color:#fff;border-radius:20px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on,.vt.on{background:var(--y);color:#000;border-color:var(--y);font-weight:700}
.types{display:flex;gap:8px;margin-bottom:12px}
.ty{flex:1;background:var(--k2);border:2px solid transparent;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font-size:13px}
.ty.on{border-color:var(--y)}.ty b{display:block;font-size:24px}
.offer{display:flex;align-items:center;justify-content:space-between;background:var(--k2);border-radius:16px;padding:10px;margin-bottom:12px}
.offer button{width:42px;height:42px;border-radius:50%;border:0;background:var(--k3);color:var(--y);font-size:24px;cursor:pointer}
.offer .p{font-size:30px;font-weight:800;color:var(--y);text-align:center}
.btn{width:100%;border:0;border-radius:14px;background:var(--y);color:#000;font-weight:800;font-size:15px;padding:14px;cursor:pointer;margin-top:6px}
.btn.g{background:var(--k3);color:#fff}.btn.s{width:auto;padding:6px 10px;font-size:12px;border-radius:8px;margin:0 3px 0 0}.btn.r{background:var(--bad);color:#000}
.card{background:var(--k2);border-radius:16px;padding:12px;margin-bottom:10px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.av{width:44px;height:44px;border-radius:50%;background:var(--y);color:#000;font-weight:800;display:grid;place-items:center;flex:none}
.pr{margin-left:auto;font-size:22px;font-weight:800;color:var(--y)}
.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{padding:10px;font-size:14px}
.top{padding:14px 16px;display:flex;align-items:center;gap:10px;background:var(--k)}.top img{width:34px;height:34px;border-radius:9px}
.cen{align-items:center;justify-content:center;text-align:center;padding:26px;gap:12px}.cen img{width:210px;max-width:70%}
.pulse{width:70px;height:70px;border-radius:50%;background:var(--y);margin:20px auto;animation:pu 1.2s infinite}
@keyframes pu{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
.stars{display:flex;justify-content:center;gap:6px;font-size:36px;margin:12px 0}.stars span{cursor:pointer;color:var(--k3)}.stars span.on{color:var(--y)}
.note{font-size:12px;color:var(--mu);text-align:center}
.pad{padding:16px;overflow:auto;flex:1}
.lb{font-size:12px;color:var(--mu);margin:10px 0 4px;display:block}
input{width:100%;background:var(--k2);border:1px solid var(--k3);border-radius:10px;color:#fff;padding:11px;font-size:14px}
input:focus{outline:2px solid var(--y)}
.tabs{display:flex;background:var(--k2);border-radius:12px;padding:4px;margin-bottom:6px}
.tabs span{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:14px;cursor:pointer}.tabs span.on{background:var(--y);color:#000;font-weight:700}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:16px}
.bd{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--k3)}
.bd.ok{background:#12351f;color:var(--ok)}.bd.w{background:#3a3000;color:var(--y)}.bd.b{background:#3d1717;color:var(--bad)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:var(--k2);border-radius:14px;padding:14px}.kp b{display:block;font-size:26px;color:var(--y);margin-top:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th{color:var(--mu);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--k3)}td{padding:10px 8px;border-bottom:1px solid var(--k2)}
.sw{width:50px;height:28px;border-radius:20px;background:var(--k3);position:relative;cursor:pointer;flex:none}.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--y)}.sw.on i{left:25px;background:#000}
select{width:100%;background:var(--k2);border:1px solid var(--k3);border-radius:10px;color:#fff;padding:11px;font-size:14px;margin-bottom:4px}
.thumb{width:100%;height:96px;object-fit:cover;border-radius:12px;display:block;margin:6px 0}
.live{width:10px;height:10px;border-radius:50%;background:var(--mu);flex:none}.live.on{background:var(--ok);box-shadow:0 0 0 4px #3ddc8433}
.bar{height:6px;background:var(--k3);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y);width:0}
/* modo app: pantalla completa en celular o al instalar */
@media (max-width:520px),(display-mode:standalone){
html,body{height:100%}
body{padding:0;gap:0;display:block;min-height:100dvh;background:#0B0B0B}
.phone{max-width:none;width:100%;height:100dvh;max-height:none;border:0;border-radius:0;box-shadow:none}
.adm{max-width:none;min-height:100dvh;border-radius:0}
#foot{display:none}
}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
</style></head><body>
<div id="app" class="phone"></div>
<div class="note" id="foot"></div>

function setRt(r){const t={};["n","tel","p"].forEach(i=>{const e=document.getElementById(i);if(e)t[i]=e.value});S.rt=r;render();for(const i in t){const e=document.getElementById(i);if(e)e.value=t[i]}}

function err(m){document.getElementById("err").textContent=m}
function login(){const u=$("u"),p=$("p");
 if(S.role=="admin"){if(u=="admin"&&p=="admin123"){S.tab="res";return go("admin")}return err("Usuario o contraseña incorrectos")}
 const x=DB.users.find(z=>z.tel==u&&z.pw==p);if(!x)return err("Celular o contraseña incorrectos");
 if(x.st=="bloqueado")return err("Tu cuenta está bloqueada");
 S.uid=x.id;enter(x.role)}
function reg(){const n=$("n"),tel=$("tel"),p=$("p");
 if(!n||!/^9\d{8}$/.test(tel))return err("Ingresa tu nombre y un celular válido (9 dígitos)");
 if(p.length<4)return err("La contraseña debe tener al menos 4 caracteres");
 if(DB.users.some(z=>z.tel==tel))return err("Ese celular ya está registrado");
 let u={id:Date.now(),role:S.rt,n,tel,pw:p};
 if(S.rt=="pasajero")u.st="activo";
 else{const dni=$("dni"),mod=$("mod"),pl=$("pl"),lic=$("lic");
  if(!/^\d{8}$/.test(dni)||!mod||!pl||!lic)return err("Completa DNI (8 dígitos), vehículo, placa y licencia");
  Object.assign(u,{st:"pendiente",dni,v:S.vt,mod,pl:pl.toUpperCase(),lic,r:5})}
 DB.users.push(u);save();S.uid=u.id;S.docs=false;enter(S.rt)}
function enter(r){S.org="Plaza de Armas";S.dest="Mercado de Abastos";S.price=sug();go(r=="pasajero"?"home":"drv");if(r=="pasajero")askLoc()}
function toM(lat,lng){return{x:(lng-LNG0)*111320*Math.cos(LAT0*Math.PI/180),y:(lat-LAT0)*110574}}
function locate(cb){S.gps={st:"wait"};if(!navigator.geolocation){S.gps={st:"err"};return cb&&cb()}
 try{navigator.geolocation.getCurrentPosition(p=>{const m=toM(p.coords.latitude,p.coords.longitude);S.gps=Math.abs(m.x)<3000&&Math.abs(m.y)<3000?{st:"ok",...m}:{st:"out"};cb&&cb()},e=>{S.gps={st:e.code==1?"deny":"err"};cb&&cb()},{enableHighAccuracy:true,timeout:8000})}catch(e){S.gps={st:"err"};cb&&cb()}}
function askLoc(){locate(()=>{if(S.gps.st=="ok")S.org="gps";S.price=sug();if(S.screen=="home")render()});if(S.screen=="home")render()}
function sel(k,v,g){const o=a=>a.map(n=>`<option ${n==v?"selected":""}>${n}</option>`).join("");return `<select onchange="S.${k}=this.value;S.price=sug();render()">${g&&S.gps.st=="ok"?`<option value="gps" ${v=="gps"?"selected":""}>Mi ubicación actual (GPS)</option>`:""}<optgroup label="Lugares">${o(PLACES.map(p=>p[0]))}</optgroup><optgroup label="Calles">${o(CALLES.map(c=>c[0]))}</optgroup></select>`}
function adj(n){S.price=Math.max(2,S.price+n);render()}
function rnd(A,r){const c=(v,a,b)=>Math.max(a,Math.min(b,v));return{x:c(A.x+(Math.random()<.5?-1:1)*r*.6,-500,700),y:c(A.y+(Math.random()<.5?-1:1)*r*.4,-450,250)}}
function search(){S.offers=[];const A=pt(S.org),el=DB.users.filter(u=>u.role=="conductor"&&u.st=="aprobado"&&u.v==S.type).slice(0,3);S.exp=el.length;S.screen="offers";render();const sg=sug(),ra=S.price/sg;
 el.forEach((d,i)=>setTimeout(()=>{if(S.screen!="offers")return;const p0=rnd(A,300+i*250),dm=dist(A,p0),m=ra>=1?[1,1,1.1][i]:[.95,1,1.15][i],price=ra>=1?Math.round(S.price*m*2)/2:Math.max(S.price,Math.round(sg*m*2)/2);S.offers.push({...d,pos:p0,dm,e:Math.max(1,Math.ceil(dm/SPD[d.v]/60)),price});render()},1400+i*1100))}
function startSim(a,b,v){const p=man(a,b);S.sim={phase:"pickup",path:p,len:plen(p),d:0,spd:SPD[v]}}
function acc(i){const o=S.offers[i];S.drv=o;S.me="p";S.trip={pas:U().n,org:S.org,dst:S.dest,price:o.price,drv:o};startSim(o.pos,pt(S.org),o.v);go("trip");startTimer()}
function acceptReq(){const u=U(),q=S.req;S.me="d";S.trip={pas:q.pas,org:q.org,dst:q.dst,price:q.price,drv:u};S.dtrip=q;S.req=null;startSim(S.dpos,pt(q.org),u.v);go("trip");startTimer()}
function startTimer(){clearTimer();S.tm=setInterval(tick,300)}
function clearTimer(){if(S.tm)clearInterval(S.tm);S.tm=null}
function tick(){const m=S.sim;if(!m||S.screen!="trip")return clearTimer();m.d=Math.min(m.len,m.d+m.spd*SIMK*.3);upd();if(m.d>=m.len){clearTimer();arrive()}}
function upd(){const m=S.sim,p=pos(m.path,m.d),r=m.len-m.d;if(E("mk"))E("mk").setAttribute("transform",`translate(${p.x} ${-p.y})`);if(E("eta"))E("eta").textContent=fmin(r/m.spd);if(E("ds"))E("ds").textContent=Math.round(r)+" m restantes";if(E("bar"))E("bar").style.width=(100*m.d/Math.max(m.len,1))+"%"}
function arrive(){const m=S.sim;if(m.phase=="pickup"){m.phase="arrived";render()}else if(S.me=="p"){saveTrip();go("rate")}else{m.phase="end";render()}}
function startRide(){const m=S.sim,A=m.path[m.path.length-1];m.phase="ride";m.path=man(A,pt(S.trip.dst));m.len=plen(m.path);m.d=0;render();startTimer()}
function saveTrip(){const t=S.trip;DB.trips.push({id:DB.trips.length+1,pas:t.pas,drv:t.drv.n,v:t.drv.v,dest:t.dst,price:t.price,f:today()});save()}
function dfinish(){saveTrip();S.dpos={...pt(S.trip.dst),real:false};S.dtrip=null;S.sim=null;go("drv");if(S.on)wait()}
function trackView(){const t=S.trip,m=S.sim,me=S.me,end=m.path[m.path.length-1],tg=m.phase=="ride"||m.phase=="end"?t.dst:t.org,r=m.len-m.d,p=pos(m.path,m.d),p1=me=="p";
 const hd={pickup:p1?"Tu conductor llega en":"Llegas al pasajero en",ride:p1?"Llegas a tu destino en":"Llegas al destino en",arrived:p1?"Tu conductor llegó":"Llegaste al punto de recojo",end:"Llegaste al destino"}[m.phase];
 const bt=m.phase=="arrived"?`<button class="btn" onclick="startRide()">${p1?"Subir y comenzar viaje":"Recoger pasajero e iniciar viaje"}</button>`:m.phase=="end"?`<button class="btn" onclick="dfinish()">Finalizar viaje</button>`:"";
 return `<div class="scr"><div class="map">${mapN([m.path[0],end],k=>route(m.path,k)+sq(end,k)+`<g id="mk" transform="translate(${p.x} ${-p.y})"><circle r="${16*k}" fill="#FFCC0A44"/><circle r="${9*k}" fill="#fff" stroke="#FFCC0A" stroke-width="${3*k}"/></g>`)}</div>
 <div class="sheet"><div class="row"><span class="live on"></span><span class="mu">${p1?"Seguimiento en vivo (simulado, acelerado)":"Compartiendo tu ubicación con el pasajero (simulado)"}</span></div>
 <p class="mu" style="margin-top:8px">${hd}</p><div id="eta" style="font-size:32px;font-weight:800;color:var(--y)">${m.phase=="arrived"||m.phase=="end"?"0 min":fmin(r/m.spd)}</div>
 <div class="bar"><i id="bar" style="width:${100*m.d/Math.max(m.len,1)}%"></i></div><div class="mu" id="ds" style="margin:6px 0 10px">${Math.round(r)} m restantes</div>
 <div class="card row"><img class="thumb" style="width:110px;height:64px;margin:0" src="${imgOf(tg)}" alt=""><div><div class="mu">${m.phase=="ride"||m.phase=="end"?"Destino":"Punto de recojo"}</div><b>${tg}</b><div class="mu">${near(end)}</div></div></div>
 <div class="card row"><div class="av">${(p1?t.drv.n:t.pas)[0]}</div><div><b>${p1?t.drv.n:t.pas}</b><div class="mu">${p1?t.drv.v+" · "+t.drv.mod+" · "+t.drv.pl:"Pasajero"}</div></div><div class="pr">${fm(t.price)}</div></div>${bt}</div></div>`}
function toggle(){S.on=!S.on;S.req=null;S.dpos=null;if(S.on)locate(()=>{S.dpos=S.gps.st=="ok"?{x:S.gps.x,y:S.gps.y,real:true}:{...PL[PLACES[Math.floor(Math.random()*PLACES.length)][0]],real:false};if(S.screen=="drv"){render();wait()}});render()}
function wait(){setTimeout(()=>{if(!S.on||!S.dpos||S.req||S.dtrip||S.screen!="drv")return;const u=U(),ps=DB.users.filter(x=>x.role=="pasajero"),L=PLACES.map(p=>p[0]),o=L[Math.floor(Math.random()*L.length)];let d=L[Math.floor(Math.random()*L.length)];if(d==o)d=o=="Plaza de Armas"?"Mercado de Abastos":"Plaza de Armas";const A=pt(o),dm=dist(S.dpos,A);S.req={pas:ps[Math.floor(Math.random()*ps.length)].n,org:o,dst:d,price:Math.max(2,fare(A,pt(d),u.v)+[-.5,0,.5][Math.floor(Math.random()*3)]),dm,e:Math.max(1,Math.ceil(dm/SPD[u.v]/60))};render()},1800)}
function upPhoto(inp,i){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,480/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);DB.photos[ALL[i][0]]=c.toDataURL("image/jpeg",.6);save();render()};im.src=r.result};r.readAsDataURL(f)}
function setSt(id,st){DB.users.find(u=>u.id==id).st=st;save();render()}
