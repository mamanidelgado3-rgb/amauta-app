name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R icons _site/icons
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = {
              "url": os.environ.get("SUPABASE_URL", ""),
              "anonKey": os.environ.get("SUPABASE_ANON_KEY", ""),
          }
          if not config["url"] or not config["anonKey"]:
              print("::warning::Set SUPABASE_URL and SUPABASE_ANON_KEY in repository Actions secrets to enable account registration and login.")
          Path("_site/config.js").write_text(
              "window.AMAUTA_SUPABASE_CONFIG = "
              + json.dumps(config, separators=(",", ":"))
              + ";\n",
              encoding="utf-8",
          )
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
