name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: android
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AmautaDriver Android ${{ github.ref_name }}
          generate_release_notes: true
          body: "APK Android de demostración firmado para instalación manual. No es una versión de Play Store y requiere conexión a Internet para cargar la app."
          files: android/app/build/outputs/apk/debug/amauta-app-1.0.0-android.apk
